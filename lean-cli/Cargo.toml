# cas-lean: prove a Lean theorem's cone with one succinct proof, and verify
# such a proof (docs/lean-bundle.md in flock). It is not a member of the
# workspace: it builds Flock, which is large and comes from another
# repository. Clone alon/flock (branch cas) next to cas as `flock`.
[package]
name = "cas-lean-cli"
version = "0.1.0"
edition = "2024"
description = "Prove and verify Lean theorems with succinct proofs"

[[bin]]
name = "cas-lean"
path = "src/main.rs"

[dependencies]
cas-lean = { path = "../lean" }
flock-prover = { path = "../../flock/crates/flock-prover" }
flock-core = { path = "../../flock/crates/flock-core" }
flock-field = { path = "../../flock/crates/flock-field" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1.8.7"

[profile.release]
opt-level = 3

[workspace]
