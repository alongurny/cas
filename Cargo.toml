[package]
name = "cas-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
hex = "0.4.3"
sha2 = "0.11.1"
sha3 = "0.12.0"
proptest = { version = "1.12.0", optional = true }
sha1 = "0.11.0"
md-5 = "0.11.0"
ureq = "3.5.0"
percent-encoding = "2.3.2"
zstd = "0.13"
fastcdc = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"], optional = true }
libc = "0.2"

[dev-dependencies]
cas-core = { path = ".", features = ["test-tls"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
conformance = ["dep:proptest"]
test-tls = ["dep:rcgen"]
# Plain HTTP besides HTTPS, for benchmarks against git only (bench/).
bench-insecure = []

[[test]]
name = "conformance"
required-features = ["conformance"]

[workspace]
members = [".", "version", "cli"]
