[package]
name = "cas-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
hex = "0.4.3"
sha2 = "0.11.1"
sha3 = "0.12.0"
proptest = { version = "1.12.0", optional = true }
sha1 = "0.11.0"
md-5 = "0.11.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
conformance = ["dep:proptest"]

[[test]]
name = "conformance"
required-features = ["conformance"]
