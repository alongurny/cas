[package]
name = "cas-forge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cas-forge"
path = "src/main.rs"

[dependencies]
cas-core = { path = ".." }
cas-version = { path = "../version" }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11.1"
hex = "0.4.3"
ureq = { version = "3.5.0", features = ["socks-proxy"] }
flate2 = "1"
tar = "0.4"
similar = "2.7"
mimalloc = "0.1.52"

[dev-dependencies]
cas-core = { path = "..", features = ["test-tls"] }
tempfile = "3.27.0"
