[package]
name = "cas-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cas"
path = "src/main.rs"

[dependencies]
cas-core = { path = ".." }
cas-version = { path = "../version" }
mimalloc = "0.1.52"

[features]
# Plain HTTP for benchmarks against git (bench/); never in a normal build.
bench-insecure = ["cas-core/bench-insecure"]

[dev-dependencies]
cas-core = { path = "..", features = ["test-tls"] }
tempfile = "3.27.0"
blake3 = "1.8.7"
